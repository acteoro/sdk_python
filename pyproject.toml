[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "verificrca"
dynamic = ["version"]
description = "SDK Python oficial pentru API-ul verificrca.ro: verificare RCA, ITP, rovinieta si ARR, monitorizarea flotei si webhook-uri de expirare."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "verificrca", email = "contact@verificrca.ro" }]
keywords = [
    "verificrca", "verificare rca", "verificare itp", "verificare rovinieta", "verificare arr",
    "rca", "itp", "rovinieta", "copie conforma arr", "asigurare auto", "flota auto", "romania",
    "api", "sdk", "car insurance check", "vehicle inspection", "road tax", "fleet management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Natural Language :: Romanian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3", "anyio>=3.7,<5"]

[project.urls]
Homepage = "https://www.verificrca.ro/api-acces"
Documentation = "https://github.com/verificrca/sdk_python#readme"
Repository = "https://github.com/verificrca/sdk_python"
Changelog = "https://github.com/verificrca/sdk_python/blob/main/CHANGELOG.md"
Issues = "https://github.com/verificrca/sdk_python/issues"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.6"]

[tool.hatch.version]
path = "src/verificrca/_versiune.py"

[tool.hatch.build.targets.sdist]
include = ["src/verificrca", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/verificrca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "e2e"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
